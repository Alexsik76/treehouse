services:
  db:
    image: postgres:16-alpine
    container_name: treehouse_db
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: treehouse
    ports:
      - "5432:5432"
    networks:
      - treehouse_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d treehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  treehouse_net:
    driver: bridge